<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17243a;background:#eef2f7;line-height:1.55;--navy:#12233c;--ink:#17243a;--muted:#728096;--line:#dbe3ed;--blue:#3769d5;--blue-soft:#eaf0ff;--orange:#d98232;--orange-soft:#fff2df;--rose:#c24c69;--rose-soft:#ffedf2;--green:#2b8a74;--green-soft:#e5f7f1;--panel:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app-shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.topbar{display:flex;align-items:center;gap:20px;padding:15px 22px;background:var(--navy);color:#fff;box-shadow:0 5px 18px #10213b2b}.brand{display:flex;align-items:center;gap:11px;min-width:225px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#4d75da;font-weight:900}.brand h1{font-size:16px;margin:0;letter-spacing:.01em}.brand p{font-size:11px;color:#afbdd1;margin:1px 0 0}.toolbar{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.search-wrap{position:relative;flex:1;max-width:440px}.search-wrap span{position:absolute;left:11px;top:7px;color:#93a5c1;font-size:15px}.search-wrap input{width:100%;height:34px;padding:0 12px 0 32px;border:1px solid #435671;border-radius:9px;background:#1b304d;color:#fff;outline:none}.search-wrap input::placeholder{color:#91a2ba}.search-wrap input:focus{border-color:#91b2ff;box-shadow:0 0 0 3px #6e9cf32e}.toolbar select,.toolbar button{height:34px;border:1px solid #435671;border-radius:9px;background:#1b304d;color:#dbe6f7;padding:0 11px;font:inherit;font-size:12px;cursor:pointer}.toolbar button:hover,.toolbar select:hover{border-color:#8ca9dd}.toolbar button.primary{background:#3769d5;border-color:#3769d5;color:#fff}.workspace{display:grid;grid-template-columns:270px minmax(460px,1fr) 330px;gap:0;min-height:0;overflow:hidden}.tree-panel,.graph-panel,.inspector-panel{min-height:0;background:var(--panel)}.tree-panel{border-right:1px solid var(--line);overflow:auto}.graph-panel{display:flex;flex-direction:column;background:#f7f9fc;min-width:0}.inspector-panel{border-left:1px solid var(--line);overflow:auto}.panel-heading{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px}.panel-heading h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0;color:#4b5d77}.panel-heading small{color:#96a3b6;font-size:11px}.tree-scroll{padding:3px 10px 24px}.tree-group{margin:0}.tree-row{display:flex;align-items:center;gap:3px;min-height:34px;margin:2px 0;border-radius:8px;padding:0 6px;color:#5b6a80;font-size:12px}.tree-row:hover{background:#f2f5fa}.tree-row.active{background:var(--blue-soft);color:#2454b2;font-weight:800}.tree-row.muted{opacity:.38}.tree-row.match{box-shadow:inset 3px 0 0 var(--orange)}.tree-toggle{display:grid;place-items:center;width:20px;height:24px;border:0;background:transparent;color:#8593a8;cursor:pointer;font-size:12px}.tree-node{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;padding:5px 2px;min-width:0;flex:1}.tree-node span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type-dot{width:7px;height:7px;border-radius:50%;flex:none;background:#7d93b8}.type-dot.root{background:#486ad2}.type-dot.risk{background:var(--rose)}.type-dot.evaluation{background:var(--green)}.type-dot.research{background:var(--orange)}.tree-count{color:#a0acbc;font-size:10px;margin-left:auto}.graph-header{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 12px}.graph-header h2{font-size:18px;margin:0;color:var(--ink)}.graph-header p{font-size:11px;color:var(--muted);margin:3px 0 0}.graph-tools{display:flex;align-items:center;gap:7px}.graph-tools button{border:1px solid var(--line);border-radius:8px;background:#fff;color:#5a6980;padding:7px 9px;font:inherit;font-size:11px;cursor:pointer}.graph-tools button:hover{border-color:#9ab0da;color:#2a56b4}.graph-stage{position:relative;flex:1;min-height:520px;margin:0 18px 17px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 20% 12%,#fff 0,#f8fafc 34%,#f2f5f9 100%);overflow:auto}.graph-stage:before{content:"局部关系图 · 父子关系 / 相关关系 / 深入研究";position:absolute;left:15px;top:13px;color:#9aa7b8;font-size:10px;z-index:1}.graph-stage svg{display:block;width:100%;min-width:760px;height:100%;min-height:520px}.edge{stroke:#b5c2d3;stroke-width:1.5}.edge.research{stroke:var(--orange);stroke-width:2.2}.edge.related{stroke:#9aa9bc;stroke-dasharray:5 4}.edge.active{stroke:var(--blue);stroke-width:3}.edge.active.research{stroke:var(--orange)}.graph-node{cursor:pointer;outline:none}.graph-node rect{fill:#fff;stroke:#bdc9d9;stroke-width:1.5;filter:drop-shadow(0 4px 7px #1b365010)}.graph-node:hover rect{stroke:#6e8fdb;stroke-width:2}.graph-node.active rect{fill:#edf3ff;stroke:var(--blue);stroke-width:3;filter:drop-shadow(0 5px 10px #3769d53d)}.graph-node.muted{opacity:.34}.graph-node .node-title{font-size:12px;font-weight:800;fill:#243753}.graph-node .node-summary{font-size:9px;fill:#8090a5}.graph-node.risk rect{fill:#fff6f8;stroke:#d98aa0}.graph-node.risk.active rect{fill:var(--rose-soft);stroke:var(--rose)}.graph-node.evaluation rect{fill:#f0fbf8;stroke:#82beaf}.graph-node.evaluation.active rect{fill:var(--green-soft);stroke:var(--green)}.graph-node.research rect{fill:#fff7eb;stroke:#e5ad68}.graph-node.research.active rect{fill:var(--orange-soft);stroke:var(--orange)}.legend{display:flex;gap:12px;align-items:center;padding:0 20px 13px;flex-wrap:wrap;color:#7a8799;font-size:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#607dab}.legend i.risk{background:var(--rose)}.legend i.evaluation{background:var(--green)}.legend i.research{background:var(--orange)}.legend em{display:inline-block;width:22px;border-top:2px solid #b5c2d3}.legend em.dashed{border-top-style:dashed}.inspector-body{padding:0 18px 30px}.eyebrow{display:flex;align-items:center;gap:7px;color:#7890b4;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.08em}.inspector-title{font-size:25px;line-height:1.25;margin:9px 0 7px;color:var(--ink)}.inspector-summary{font-size:13px;color:#596980;margin:0 0 15px}.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 18px}.tag-list span{padding:4px 8px;border-radius:999px;background:#eff3f9;color:#61718a;font-size:10px}.info-block{border-top:1px solid #e7ecf2;padding:14px 0}.info-block h3{font-size:11px;color:#7a889d;text-transform:uppercase;letter-spacing:.08em;margin:0 0 9px}.relation-list{display:flex;flex-direction:column;gap:5px}.relation-list button{border:0;background:#f5f7fb;color:#315db8;border-radius:7px;text-align:left;padding:7px 8px;font:inherit;font-size:11px;cursor:pointer}.relation-list button:hover{background:#eaf0ff}.content-copy{font-size:12px;color:#5d6d83}.content-copy p{margin:0 0 9px}.source-link{display:inline-block;color:#3769d5;font-size:11px;text-decoration:none;overflow-wrap:anywhere}.empty{padding:30px 18px;color:#7c899d;text-align:center;font-size:13px}.statusbar{display:flex;justify-content:space-between;gap:15px;padding:9px 18px;background:#fff;border-top:1px solid var(--line);color:#8794a7;font-size:10px}.statusbar strong{color:#53657f}.search-empty{margin:11px 0;padding:10px;border:1px dashed #e1a15a;border-radius:8px;background:#fff9ee;color:#9a6426;font-size:11px}.mobile-only{display:none}@media(max-width:1000px){.workspace{grid-template-columns:235px minmax(420px,1fr) 285px}.brand{min-width:190px}.topbar{gap:12px;padding:13px 15px}}@media(max-width:760px){.topbar{align-items:flex-start;flex-wrap:wrap}.brand{min-width:calc(100% - 40px)}.toolbar{width:100%;flex-wrap:wrap}.search-wrap{max-width:none;min-width:180px}.toolbar select{flex:1}.toolbar button{flex:none}.workspace{display:flex;flex-direction:column;overflow:auto}.tree-panel,.inspector-panel{border:0;border-bottom:1px solid var(--line);max-height:none}.tree-panel{order:0}.graph-panel{order:1;min-height:570px}.inspector-panel{order:2}.tree-scroll{max-height:260px}.graph-stage{min-height:450px;margin:0 10px 12px}.graph-stage svg{min-height:450px}.graph-header{padding:14px 12px 10px}.legend{padding:0 12px 10px}.panel-heading{padding:13px 13px 8px}.inspector-body{padding:0 13px 22px}.statusbar{font-size:9px;flex-wrap:wrap}}
</style>

.graph-panel{overflow:hidden}

  .topbar{display:block}
  .brand{min-width:0}
  .toolbar{width:100%;margin-top:12px;display:flex;flex-wrap:wrap}

<style>
:root{--muted:#52627a;--line:#c4d0de;--canvas:#f8fbff;--edge:#71829a;--control-bg:#fff;--control-fg:#243650;--node-bg:#fff;--node-blue-bg:#f4f8ff;--node-risk-bg:#fff1f5;--node-eval-bg:#effaf6;--node-research-bg:#fff5e7}
[data-theme="dark"]{--ink:#edf4ff;--muted:#b5c4d9;--line:#31445f;--panel:#121d2d;--canvas:#0d1725;--edge:#8396b1;--control-bg:#18263a;--control-fg:#edf4ff;--blue-soft:#1c376d;--node-bg:#19283b;--node-blue-bg:#182d4c;--node-risk-bg:#482738;--node-eval-bg:#173b38;--node-research-bg:#4a351f}
body{color:var(--ink);background:var(--canvas);transition:background .2s,color .2s}
.topbar,.statusbar{color:var(--ink);background:var(--panel);border-color:var(--line)}
.tree-panel,.graph-panel,.inspector-panel{background:var(--panel);color:var(--ink)}
.graph-stage{background:var(--canvas);border-color:var(--line)}
.panel-heading h2,.graph-header h2,.inspector-title,.tree-node{color:var(--ink)}
.panel-heading small,.graph-header p,.node-summary,.content-copy,.inspector-summary,.statusbar,.tree-count,.legend{color:var(--muted)}
.tree-row.active{background:var(--blue-soft);color:var(--ink)}
.tree-row:hover,.tree-row.match{background:color-mix(in srgb,var(--blue-soft) 70%,transparent)}
button,select,.search-wrap input{background:var(--control-bg);color:var(--control-fg);border-color:var(--line)}
button:hover{border-color:var(--blue);color:var(--ink)}
.graph-node rect{fill:var(--node-bg);stroke:var(--line)}
.graph-node.root rect,.graph-node.module rect{fill:var(--node-blue-bg)}
.graph-node.risk rect{fill:var(--node-risk-bg)}
.graph-node.evaluation rect{fill:var(--node-eval-bg)}
.graph-node.research rect{fill:var(--node-research-bg)}
.graph-node .node-title{fill:var(--ink)}
.graph-node .node-summary{fill:var(--muted)}
.edge{stroke:var(--edge)!important}
.edge.active{stroke:var(--blue)!important}
.graph-canvas marker path{fill:var(--edge)}
.theme-toggle{min-width:58px;background:var(--control-bg)!important;color:var(--control-fg)!important;border-color:var(--line)!important}
</style>

<body>
<div class="app-shell">
<header class="topbar">
  <div class="brand"><div class="brand-mark">R</div><div><h1>RAG 知识图谱</h1><p>局部关系探索 · 74 个概念节点</p></div></div>
  <div class="toolbar"><label class="search-wrap"><span>⌕</span><input id="search-input" type="search" placeholder="搜索节点、摘要或标签" aria-label="搜索节点、摘要或标签"></label><select id="type-filter" aria-label="节点类型过滤"><option value="all">全部类型</option><option value="module">核心概念</option><option value="risk">风险</option><option value="evaluation">评估</option><option value="research">深入研究</option></select><button id="expand-neighbors">展开邻居</button><button id="reset-view" class="primary">重置视图</button><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换为深色主题">深色</button></div>
</header>
<div class="workspace"><aside class="tree-panel"><div class="panel-heading"><h2>知识树</h2><small id="tree-count"></small></div><div id="tree-scroll" class="tree-scroll"></div></aside>
<main class="graph-panel"><div class="graph-header"><div><h2 id="graph-title">局部关系图</h2><p id="graph-subtitle">选择节点查看父子关系和相关知识</p></div><div class="graph-tools"><button id="zoom-in" aria-label="放大图谱">＋</button><button id="zoom-out" aria-label="缩小图谱">－</button></div></div><div id="graph-stage" class="graph-stage"><svg id="graph-canvas" role="img" aria-label="RAG 局部关系图"></svg></div><div class="legend"><span><i></i>核心节点</span><span><i class="risk"></i>风险</span><span><i class="evaluation"></i>评估</span><span><i class="research"></i>深入研究</span><span><em></em>父子</span><span><em class="dashed"></em>相关</span></div></main>
<aside class="inspector-panel"><div class="panel-heading"><h2>节点详情</h2><small id="neighbor-count"></small></div><div id="inspector-body" class="inspector-body"></div></aside></div>
<footer class="statusbar"><span>当前路径：<strong id="breadcrumb">RAG</strong></span><span id="status-text">局部视图 · 深度 1</span></footer>
</div>
<script>
const modules=[
{id:'rag-concept-rag',title:'RAG（检索增强生成）',type:'module',summary:'通过外部知识检索增强模型生成，不等同于单纯的向量数据库。',tags:['RAG','方法'],body:'离线链路负责解析、清洗、切分、向量化和索引；在线链路负责查询改写、召回、重排、上下文拼接和生成。',children:[['rag-rag-architecture','系统架构','离线知识加工与在线问答链路协作，覆盖来源、权限、缓存和评估。'],['rag-rag-workflow','端到端工作流','问题分类、查询改写、召回、重排、生成和引用检查构成完整闭环。'],['rag-rag-limits','边界与适用场景','知识查找适合 RAG；实时交易、精确聚合和业务动作应结合工具。']]},
{id:'rag-concept-llm',title:'大语言模型（LLM）',type:'module',summary:'负责理解问题、组织证据和生成自然语言答案。',tags:['LLM','生成'],body:'上下文窗口、解码参数和指令层级共同影响模型如何使用检索证据。',children:[['rag-llm-context-window','上下文窗口','上下文不是越大越好，应先去重、排序和压缩。'],['rag-llm-decoding','解码与生成参数','temperature、top_p 和最大输出长度影响稳定性与多样性。'],['rag-llm-instruction-hierarchy','指令层级','系统规则优先于用户问题和外部文档，外部资料应视为数据。']]},
{id:'rag-concept-embedding',title:'Embedding',type:'module',summary:'把文本映射成向量，用于计算语义相似度。',tags:['Embedding','表示'],body:'距离指标必须与模型的训练和归一化方式匹配，相似度高也不等于事实正确。',children:[['rag-embedding-similarity','相似度与距离','余弦相似度、点积或欧氏距离衡量向量接近程度。'],['rag-embedding-model-selection','模型选择','语言覆盖、领域术语、维度、吞吐量和成本需要用真实问题集比较。'],['rag-embedding-version-drift','版本与语义漂移','模型升级会改变向量空间，索引必须记录模型版本。']]},
{id:'rag-concept-vector-database',title:'向量数据库',type:'module',summary:'存储向量及元数据，并提供近似近邻搜索。',tags:['向量数据库','存储'],body:'索引参数影响召回率、内存和延迟；元数据过滤和更新一致性是生产关键。',children:[['rag-vector-ann-index','近似近邻索引','HNSW、IVF 等索引用少量精确度换取速度。'],['rag-vector-metadata-filter','元数据过滤与权限','租户、用户权限、版本和时间过滤必须在检索链路强制执行。'],['rag-vector-update-consistency','更新一致性','原文、向量、元数据与缓存需要通过哈希和索引版本保持一致。']]},
{id:'rag-concept-chunking',title:'文档切分（Chunking）',type:'module',summary:'把长文档拆成适合检索的知识片段。',tags:['Chunking','预处理'],body:'切分大小、重叠比例和父子片段关系决定检索精度与上下文完整性。',children:[['rag-chunking-strategies','切分策略','固定长度、递归、按标题、语义和父子文档都是常见策略。'],['rag-chunking-overlap','重叠与连续性','重叠避免论证被切断，但过大会造成重复召回和索引膨胀。'],['rag-chunking-parent-child','父子片段检索','小片段精准召回，父章节补充背景，两者保留稳定定位。']]},
{id:'rag-concept-retriever',title:'检索器（Retriever）',type:'module',summary:'根据查询从知识库召回候选片段。',tags:['Retriever','检索'],body:'关键词、向量、元数据和混合检索分别处理不同问题，召回质量需要独立评估。',children:[['rag-retriever-lexical-vector','关键词与向量','BM25 擅长错误码和术语，向量检索擅长自然语言和同义表达。'],['rag-retriever-hybrid','混合检索','通过分数归一化、排名融合或 RRF 组合多路结果。'],['rag-retriever-recall-metrics','召回质量指标','Recall@K、Precision@K 和 MRR 区分召回和排序问题。']]},
{id:'rag-concept-reranker',title:'重排序器（Reranker）',type:'module',summary:'对初步召回的候选片段重新计算相关性。',tags:['Reranker','排序'],body:'Cross-Encoder 通常更精确但更慢，适合对有限候选集进行第二阶段排序。',children:[['rag-reranker-cross-encoder','Cross-Encoder','同时读取查询和候选片段，直接判断相关性。'],['rag-reranker-top-k-latency','Top-K 与延迟','扩大召回、限制重排输入、最后保留互补证据。'],['rag-reranker-evaluation','重排评估','比较正确证据排名、忠实度、延迟和成本的整体变化。']]},
{id:'rag-concept-prompt',title:'Prompt',type:'module',summary:'约束模型角色、证据使用方式和输出格式。',tags:['Prompt','控制'],body:'模板应明确证据区块、未知处理、引用要求和输出格式，同时防范外部文档注入。',children:[['rag-prompt-template','模板结构','将角色规则、用户问题、检索证据、引用要求和格式分成区块。'],['rag-prompt-context-assembly','上下文组装','按相关性、可信度、时间和互补性排列证据。'],['rag-prompt-injection-defense','注入防护','把外部文档当作数据而非指令，并限制工具调用和敏感输出。'],['rag-prompt-role-task','角色与任务定义','明确模型角色、任务目标、受众和完成标准，减少泛化回答。'],['rag-prompt-constraints','约束条件设计','用范围、语言、禁止行为和边界条件把可接受结果写清楚。'],['rag-prompt-few-shot','Few-shot 示例','用有代表性的正例、反例和边界例说明输入到输出的映射。'],['rag-prompt-structured-output','结构化输出','用 Schema、字段约束和校验规则让结果可解析、可验证、可重试。'],['rag-prompt-decomposition','任务分解与推理','把复杂目标拆成步骤和检查点，再汇总为符合输出契约的结果。'],['rag-prompt-evaluation-iteration','提示词评估与迭代','用代表性测试集、质量指标和回归样本比较提示词版本。','evaluation'],['rag-prompt-long-context','长上下文提示','对长材料去重、分段、排序和压缩，并保留证据定位。','research'],['rag-prompt-tool-use','工具调用提示','明确工具前置条件、参数、权限、错误处理和无工具回退路径。'],['rag-prompt-injection-research','Prompt Injection 防御深入研究','隔离外部数据与指令，限制权限边界，并用攻击样本和审计验证防护。','research']]},
{id:'rag-concept-grounding',title:'Grounding',type:'module',summary:'让答案中的关键结论能够回溯到检索证据和原始来源。',tags:['Grounding','验证'],body:'引用应具体到文档、章节、URL 或片段位置；回答必须区分事实、推断和未知。',children:[['rag-grounding-citation','引用与定位','把结论连接到文档、章节、URL 或片段位置。'],['rag-grounding-faithfulness','答案忠实度','判断答案是否被检索证据支持，而不是只看语言是否流畅。'],['rag-grounding-conflict','证据冲突','按版本、时间、权威等级和适用范围处理冲突来源。']]},

const state={selectedId:'rag-concept-hallucination',expandedIds:new Set(['rag','rag-concept-hallucination']),query:'',filter:'all',neighborDepth:1,zoom:1};
const treeScroll=document.querySelector('#tree-scroll'),treeCount=document.querySelector('#tree-count'),graphCanvas=document.querySelector('#graph-canvas'),graphTitle=document.querySelector('#graph-title'),graphSubtitle=document.querySelector('#graph-subtitle'),inspector=document.querySelector('#inspector-body'),neighborCount=document.querySelector('#neighbor-count'),breadcrumb=document.querySelector('#breadcrumb'),statusText=document.querySelector('#status-text');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const nodeTypeLabel=type=>({root:'根节点',module:'核心概念',detail:'细节节点',risk:'风险',evaluation:'评估',research:'深入研究'}[type]||type);
function depthOf(node){let depth=0,current=node;while(current.parentId&&byId.has(current.parentId)){depth+=1;current=byId.get(current.parentId)}return depth}
function pathOf(id){const path=[];let current=byId.get(id);while(current){path.unshift(current.id);current=current.parentId?byId.get(current.parentId):null}return path}
function matches(node){if(!state.query)return true;const text=[node.title,node.summary,...node.tags].join(' ').toLowerCase();return text.includes(state.query.toLowerCase())}
function filterAllows(node){return state.filter==='all'||node.type===state.filter||(state.filter==='module'&&node.type==='root')}
function visibleTree(id){const node=byId.get(id);if(!node)return false;const own=matches(node)&&filterAllows(node);return own||children.get(id).some(childId=>visibleTree(childId))}
function autoExpand(){if(state.query){nodes.filter(matches).forEach(node=>pathOf(node.id).forEach(id=>state.expandedIds.add(id)))}}
function renderTreeNode(id,level=0){const node=byId.get(id);if(!visibleTree(id))return '';const kids=children.get(id)||[];const open=state.expandedIds.has(id);const active=state.selectedId===id;const muted=state.query&&!matches(node)&&!kids.some(childId=>matches(byId.get(childId)));const match=state.query&&matches(node);let html=`<div class="tree-row ${active?'active ':''}${muted?'muted ':''}${match?'match':''}" style="padding-left:${8+level*15}px"><button class="tree-toggle" data-toggle-id="${esc(id)}" aria-label="${open?'收起':'展开'} ${esc(node.title)}">${kids.length?(open?'▾':'▸'):''}</button><button class="tree-node" data-select-id="${esc(id)}"><i class="type-dot ${esc(node.type)}"></i><span>${esc(node.title)}</span>${kids.length?`<small class="tree-count">${kids.length}</small>`:''}</button></div>`;if(open)html+=kids.map(childId=>renderTreeNode(childId,level+1)).join('');return html}
function renderTree(){autoExpand();treeScroll.innerHTML=rootIds.map(id=>renderTreeNode(id)).join('');treeCount.textContent=`${nodes.length} 节点`;treeScroll.querySelectorAll('[data-select-id]').forEach(btn=>btn.addEventListener('click',()=>selectNode(btn.dataset.selectId)));treeScroll.querySelectorAll('[data-toggle-id]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();const id=btn.dataset.toggleId;if(state.expandedIds.has(id))state.expandedIds.delete(id);else state.expandedIds.add(id);renderTree()}))}
function visibleNeighborhood(){const selected=state.selectedId;const distance=new Map([[selected,0]]);const queue=[selected];while(queue.length){const current=queue.shift();const d=distance.get(current);if(d>=state.neighborDepth)continue;edgeList.forEach(edge=>{let next=null;if(edge.from===current)next=edge.to;if(edge.to===current)next=edge.from;if(next&&!distance.has(next)){distance.set(next,d+1);queue.push(next)}})}pathOf(selected).forEach(id=>distance.set(id,Math.min(distance.get(id)??99,state.neighborDepth+1)));return nodes.filter(node=>distance.has(node.id)).slice(0,30)}
function graphLayout(drawNodes){const maxDepth=Math.max(...drawNodes.map(depthOf),1);const groups=new Map();drawNodes.forEach(node=>{const d=depthOf(node);if(!groups.has(d))groups.set(d,[]);groups.get(d).push(node)});const positions=new Map();groups.forEach((group,d)=>group.sort((a,b)=>{const pa=pathOf(a.id).join('/'),pb=pathOf(b.id).join('/');return pa.localeCompare(pb)}).forEach((node,index)=>positions.set(node.id,{x:90+d*190,y:95+index*94})));return {positions,width:Math.max(850,(maxDepth+1)*190+170),height:Math.max(540,Math.max(...[...positions.values()].map(pos=>pos.y),480)+100)}}
function nodeLabel(title){return title.length>18?`${title.slice(0,17)}…`:title}
function renderGraph(){const drawNodes=visibleNeighborhood();const {positions,width,height}=graphLayout(drawNodes);const visibleIds=new Set(drawNodes.map(node=>node.id));const activePath=new Set(pathOf(state.selectedId));const edgeSvg=edgeList.filter(edge=>visibleIds.has(edge.from)&&visibleIds.has(edge.to)).map(edge=>{const a=positions.get(edge.from),b=positions.get(edge.to);const active=activePath.has(edge.from)&&activePath.has(edge.to);return `<line class="edge ${edge.kind} ${active?'active':''}" x1="${a.x+150}" y1="${a.y+30}" x2="${b.x}" y2="${b.y+30}"/>`}).join('');const nodeSvg=drawNodes.map(node=>{const pos=positions.get(node.id),active=node.id===state.selectedId,path=activePath.has(node.id),muted=!active&&!path&&state.query&&!matches(node);return `<g class="graph-node ${esc(node.type)} ${active?'active ':''}${muted?'muted':''}" data-select-id="${esc(node.id)}" role="button" tabindex="0" aria-label="选择 ${esc(node.title)}" transform="translate(${pos.x},${pos.y})"><rect width="150" height="60" rx="10"></rect><text class="node-title" x="12" y="23">${esc(nodeLabel(node.title))}</text><text class="node-summary" x="12" y="42">${esc(nodeTypeLabel(node.type))}</text></g>`}).join('');graphCanvas.setAttribute('viewBox',`0 0 ${width} ${height}`);graphCanvas.style.transform=`scale(${state.zoom})`;graphCanvas.style.transformOrigin='top left';graphCanvas.innerHTML=`<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#b5c2d3"></path></marker></defs>${edgeSvg}${nodeSvg}`;graphCanvas.querySelectorAll('[data-select-id]').forEach(el=>{el.addEventListener('click',()=>selectNode(el.dataset.selectId));el.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(el.dataset.selectId)}})});graphTitle.textContent=byId.get(state.selectedId)?.title||'局部关系图';graphSubtitle.textContent=`显示 ${drawNodes.length} 个邻域节点 · 深度 ${state.neighborDepth}`;neighborCount.textContent=`${drawNodes.length} 邻居`;statusText.textContent=`局部视图 · 深度 ${state.neighborDepth} · 缩放 ${Math.round(state.zoom*100)}%`}
function relationButtons(ids){return ids.filter(id=>byId.has(id)).map(id=>`<button data-related-id="${esc(id)}">${esc(byId.get(id).title)}</button>`).join('')||'<span class="content-copy">暂无</span>'}
function renderInspector(){const node=byId.get(state.selectedId);if(!node){inspector.innerHTML='<div class="empty">未找到节点</div>';return}const parent=node.parentId?byId.get(node.parentId):null;const kids=children.get(node.id)||[];const rel=[...(related[node.id]||[])];const path=pathOf(node.id).map(id=>byId.get(id)?.title).filter(Boolean);breadcrumb.textContent=path.join(' / ');const sections=node.sections||[{label:'说明',text:node.body||node.summary}];const paragraphs=sections.map(section=>`<div class="detail-section"><h4>${esc(section.label)}</h4><p>${esc(section.text)}</p></div>`).join('');const noResult=state.query&&!matches(node)?`<div class="search-empty">当前节点不是搜索命中项，但保留它作为关系上下文。</div>`:'';inspector.innerHTML=`${noResult}<div class="eyebrow"><span class="type-dot ${esc(node.type)}"></span>${esc(nodeTypeLabel(node.type))}</div><h2 class="inspector-title">${esc(node.title)}</h2><p class="inspector-summary">${esc(node.summary)}</p><div class="tag-list">${node.tags.map(tag=>`<span>#${esc(tag)}</span>`).join('')}</div><div class="info-block"><h3>节点内容</h3><div class="content-copy">${paragraphs}</div></div><div class="info-block"><h3>父节点</h3><div class="relation-list">${parent?`<button data-related-id="${esc(parent.id)}">↑ ${esc(parent.title)}</button>`:'<span class="content-copy">根节点</span>'}</div></div><div class="info-block"><h3>子节点 · ${kids.length}</h3><div class="relation-list">${relationButtons(kids)}</div></div><div class="info-block"><h3>相关节点</h3><div class="relation-list">${relationButtons(rel)}</div></div><div class="info-block"><h3>知识库来源</h3><a class="source-link" href="note://${esc(node.id)}">note://${esc(node.id)}</a></div>`;inspector.querySelectorAll('[data-related-id]').forEach(btn=>btn.addEventListener('click',()=>selectNode(btn.dataset.relatedId)))}
function selectNode(id){if(!byId.has(id))return;state.selectedId=id;state.expandedIds.add(id);renderAll()}
function renderAll(){renderTree();renderGraph();renderInspector()}
const themeToggle=document.querySelector('#theme-toggle');const applyTheme=theme=>{document.documentElement.dataset.theme=theme;themeToggle.textContent=theme==='dark'?'浅色':'深色';themeToggle.setAttribute('aria-label',theme==='dark'?'切换为浅色主题':'切换为深色主题');try{localStorage.setItem('rag-theme',theme)}catch{}}
let savedTheme='light';try{savedTheme=localStorage.getItem('rag-theme')||'light'}catch{}applyTheme(savedTheme);themeToggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
document.querySelector('#search-input').addEventListener('input',event=>{state.query=event.target.value.trim();renderAll()});document.querySelector('#type-filter').addEventListener('change',event=>{state.filter=event.target.value;renderAll()});document.querySelector('#expand-neighbors').addEventListener('click',()=>{state.neighborDepth=state.neighborDepth===1?2:1;renderGraph()});document.querySelector('#reset-view').addEventListener('click',()=>{state.selectedId='rag';state.expandedIds=new Set(['rag']);state.query='';state.filter='all';state.neighborDepth=1;document.querySelector('#search-input').value='';document.querySelector('#type-filter').value='all';renderAll()});document.querySelector('#zoom-in').addEventListener('click',()=>{state.zoom=Math.min(1.35,state.zoom+.1);renderGraph()});document.querySelector('#zoom-out').addEventListener('click',()=>{state.zoom=Math.max(.75,state.zoom-.1);renderGraph()});
renderAll();
</script>
</body>
</html>
